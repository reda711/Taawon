<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taawon | Accueil</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <header class="bg-white">
      <nav
        class="relative mx-auto flex max-w-7xl items-center justify-between px-4 py-4 text-black"
      >

        <a href="index.html" class="shrink-0">
          <img
            src="assets/TAAWONLogoNavFoot.png"
            alt="Taawon"
            class="h-auto w-32"
          />
        </a>


        <div class="hidden items-center gap-8 md:flex">
          <a
            href="index.html"
            class="transition-colors text-brown bg-green/30 rounded-4xl p-3"
            aria-current="page"
          >
            Accueil
          </a>

          <a
            href="cooperatives.html"
            class="transition-colors hover:text-brown ease"
          >
            Coopératives
          </a>

          <a href="a-propos.html" class="transition-colors hover:text-brown ease">
            À propos
          </a>

          <a href="cooperative.html" class="transition-colors hover:text-brown ease">
            Devenir partenaire
          </a>
        </div>


        <a
          href="#"
          class="hidden rounded bg-brown px-4 py-3 text-sm text-white transition-colors hover:bg-green hover:text-brown ease lg:block"
        >
          Rejoindre Taawon ↗
        </a>


        <input type="checkbox" id="menu-toggle" class="peer sr-only" />


        <label
          for="menu-toggle"
          class="ml-4 cursor-pointer rounded p-2 text-2xl hover:bg-brown md:hidden"
          aria-label="Ouvrir ou fermer le menu"
        >
          ☰
        </label>


        <div
          class="absolute left-0 top-full z-50 hidden w-full border-t border-gray-200 bg-white p-5 shadow-lg peer-checked:block md:hidden"
        >
          <div class="flex flex-col items-start gap-5">
            <a
              href="index.html"
              class="text-brown transition-colors"
              aria-current="page"
            >
              Accueil
            </a>

            <a
              href="cooperatives.html"
              class="transition-colors hover:text-brown"
            >
              Coopératives
            </a>

            <a href="a-propos.html" class="transition-colors hover:text-brown">
              À propos
            </a>

            <a
              href="cooperative.html"
              class="transition-colors hover:text-brown"
            >
              Devenir partenaire
            </a>


            <a
              href="#"
              class="w-full rounded bg-brown px-4 py-3 text-center text-white transition-colors hover:bg-green hover:text-brown"
            >
              Rejoindre Taawon ↗
            </a>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>
